[package]
name = "server"
version = "0.4.0"
edition = "2024"
resolver = "2"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-macros = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
quick-xml = { version = "0.40.1", features = ["async-tokio"]}
tokio-util = "0.7.18"
futures-util = "0.3.32"
bytes = "1.12.0"
async-stream = "0.3"
dotenvy = { version = "0.15" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "time", "macros", "tls-rustls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
flate2 = "1.0"
getifs = "0.6"
clap = { version = "4.6.2", features = ["derive"] }
nanoid = "0.4"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"

model = { path = "../model" }
