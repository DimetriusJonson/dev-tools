[package]
name = "app"
version = "0.4.0"
edition = "2024"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
leptos = { version = "0.8", features = ["csr"]}
leptos_meta = "0.8"
leptos_router = { version = "0.8"}
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard", "HtmlInputElement", "FileList", "File", "Blob",
  "BlobPropertyBag",
  "Url",
  "HtmlAnchorElement",
  "Document",
  "DataTransfer",
  "DomRect",
  "Window", 
  "CssStyleDeclaration",
  "HtmlElement",
  ]}
quick-xml = { version = "0.41", features = ["async-tokio"]}
gloo-net = { version="0.7", features=["http"] }
gloo-storage = "0.4"
gloo-utils = "0.3"
js-sys = "0.3.102"
html-escape = "0.2.13"
urlencoding = "2.1"
uuid = { version = "1.23", features = ["v4", "fast-rng", "js"] }
http = "1"
leptos_i18n = { version = "0.6", features = ["plurals", "csr"] }
leptos_i18n_macro = { version = "0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
bytes = "1.12.0"
json-escape = "0.3.1"
difference = "2.0"
tw_merge = { version = "0.1", features = ["variant", "debug"]}
console_error_panic_hook = "0.1"

model = { path = "../model" }

[build-dependencies]
leptos_i18n_build = {version = "0.6", features = ["pretty_print", "csr"] }
